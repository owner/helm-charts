---
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: certificateClusterIssuer - metadata - annotations
templates:
  - common.yaml
values:
  - ../_values/controllers_main_default_container.yaml
set:
  certificateClusterIssuers:
    main:
      spec:
        acme:
          server: https://acme-v02.api.letsencrypt.org/directory
          email: admin@example.com
          privateKeySecretRef:
            name: letsencrypt-account-key
tests:
  - it: no annotations are set by default
    documentSelector:
      path: $[?(@.kind == "ClusterIssuer")].metadata.name
      value: release-name
    asserts:
      - notExists:
          path: metadata.annotations

  - it: custom annotations
    set:
      certificateClusterIssuers.main.annotations:
        test_annotation: test
    documentSelector:
      path: $[?(@.kind == "ClusterIssuer")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: metadata.annotations
          value:
            test_annotation: test

  - it: custom annotations mixed with global annotations
    set:
      global.annotations:
        global_annotation: test
      certificateClusterIssuers.main.annotations:
        test_annotation: test
    documentSelector:
      path: $[?(@.kind == "ClusterIssuer")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: metadata.annotations
          value:
            global_annotation: test
            test_annotation: test
