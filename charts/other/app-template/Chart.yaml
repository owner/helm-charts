---
apiVersion: v2
description: A common powered chart template. This can be useful for small projects that don't have their own chart.
name: app-template
version: 4.7.0
kubeVersion: ">=1.28.0-0"
maintainers:
  - name: bjw-s
    email: me@bjw-s.dev
dependencies:
  - name: common
    repository: https://owner.github.io/helm-charts
    version: 4.6.3
sources:
  - https://github.com/owner/helm-charts
annotations:
  artifacthub.io/changes: |-
    - kind: added
      description: |-
        Set Unified Service Tagging defaults: global.labels now carries
        tags.datadoghq.com/service derived from the release name, and
        propagateGlobalMetadataToPods defaults to true so the labels reach the
        pod template. This makes kubernetes_state.* metrics carry a service tag
        instead of service:N/A. Selector labels are unaffected. Releases whose
        Datadog service differs from their release name -- notably multi-controller
        releases -- should override global.labels.
    - kind: changed
      description: |-
        Upgraded the common library to v4.6.3
      links:
        - name: Upgrade notes
          url: https://owner.github.io/helm-charts/docs/app-template/upgrade-instructions/
        - name: Detailed release notes
          url: https://github.com/owner/helm-charts/releases/tag/common-4.6.3
