apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ownerforge-infra.fullname" . }}-forge-postgres
  labels:
    {{- include "ownerforge-infra.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.forgePostgres.database | quote }}
  POSTGRES_USER: {{ .Values.forgePostgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.forgePostgres.password | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ownerforge-infra.fullname" . }}-forge-postgres
  labels:
    {{- include "ownerforge-infra.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.storage.className | quote }}
  resources:
    requests:
      storage: {{ .Values.storage.size | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ownerforge-infra.fullname" . }}-forge-postgres
  labels:
    {{- include "ownerforge-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: forge-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ownerforge-infra.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: forge-postgres
  template:
    metadata:
      labels:
        {{- include "ownerforge-infra.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: forge-postgres
    spec:
      {{- include "ownerforge-infra.scheduling" . | nindent 6 }}
      containers:
        - name: postgres
          image: {{ .Values.images.postgres | quote }}
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: {{ include "ownerforge-infra.fullname" . }}-forge-postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          startupProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.forgePostgres.user | quote }}, "-d", {{ .Values.forgePostgres.database | quote }}]
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.forgePostgres.user | quote }}, "-d", {{ .Values.forgePostgres.database | quote }}]
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.forgePostgres.user | quote }}, "-d", {{ .Values.forgePostgres.database | quote }}]
          resources:
            {{- toYaml .Values.resources.postgres | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "ownerforge-infra.fullname" . }}-forge-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ownerforge-infra.fullname" . }}-forge-postgres
  labels:
    {{- include "ownerforge-infra.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "ownerforge-infra.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: forge-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
