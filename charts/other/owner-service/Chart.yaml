---
apiVersion: v2
name: owner-service
description: >-
  Owner's application chart. Declare the shape of a service - archetype, datastores,
  dependencies - and the chart derives the Kubernetes objects, platform environment
  variables and resource names from it.
type: application
version: 0.1.0
kubeVersion: ">=1.28.0-0"
home: https://github.com/owner/helm-charts/tree/main/charts/other/owner-service
maintainers:
  # `ct lint` resolves each maintainer name against the GitHub users API, so
  # this has to be a login rather than a team. Ownership of the chart sits with
  # @owner/platform-engineering; the `url` is the durable pointer.
  - name: thisisamurray
    url: https://github.com/orgs/owner/teams/platform-engineering
dependencies:
  - name: common
    repository: https://owner.github.io/helm-charts
    version: 4.6.3
sources:
  - https://github.com/owner/helm-charts
annotations:
  artifacthub.io/changes: |-
    - kind: added
      description: |-
        Initial release. Archetype `http-api` with an optional `workers:` map,
        platform environment derivation, and a `raw:` passthrough to the common
        library for anything the chart does not yet abstract.
